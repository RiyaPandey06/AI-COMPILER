<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"><animate attributeName="stop-color" values="#0f766e;#115e59;#0e7490;#0f766e" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#0f172a"><animate attributeName="stop-color" values="#0f172a;#134e4a;#0f172a" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <g fill="#fff" opacity=".12">
    <circle cx="90" cy="60" r="4"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="190" r="6"><animate attributeName="cy" values="190;165;190" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="50" r="3"><animate attributeName="cy" values="50;70;50" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="215" r="5"><animate attributeName="cy" values="215;195;215" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="5" fill="#99f6e4">COMPILER PIPELINE</text>
  <text x="450" y="130" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" fill="#fff">AI Application Generation Compiler</text>
  <text x="450" y="175" text-anchor="middle" font-family="Consolas,monospace" font-size="17" fill="#ccfbf1">
    Natural language → intent → schema → validate → repair → run
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;.3;1" dur="3s" fill="freeze"/>
  </text>
  <rect x="300" y="205" width="300" height="4" rx="2" fill="#ffffff" opacity=".2"/>
  <rect x="300" y="205" width="80" height="4" rx="2" fill="#5eead4">
    <animate attributeName="x" values="300;520;300" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
